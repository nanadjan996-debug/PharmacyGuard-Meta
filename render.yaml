services:
  - type: web
    name: pharmacyguard
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: BASETEN_API_KEY
        sync: false
      - key: BASETEN_MODEL
        value: meta-models/muse-spark-open-1026
      - key: BASETEN_BASE_URL
        value: https://inference.baseten.co/v1
      - key: BASETEN_TIMEOUT_SECONDS
        value: "14.0"


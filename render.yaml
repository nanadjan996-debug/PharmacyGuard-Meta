services:
  - type: web
    name: pharmacyguard
    runtime: docker
    plan: free
    region: oregon
    envVars:
      - key: AI_PROVIDER
        value: bedrock
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_DEFAULT_REGION
        value: us-east-1
      - key: BEDROCK_MODEL_ID
        value: us.anthropic.claude-sonnet-4-6
      - key: BASETEN_API_KEY
        sync: false
      - key: BASETEN_MODEL
        value: meta-models/muse-spark-open-1026
      - key: BASETEN_BASE_URL
        value: https://inference.baseten.co/v1
      - key: BASETEN_TIMEOUT_SECONDS
        value: "14.0"

